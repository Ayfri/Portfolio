name: CD

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KOBWEB_CLI_VERSION: 0.9.21

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Ensure Gradle is executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-upload
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Query browser cache ID
        id: browser-cache-id
        run: echo "value=$(./gradlew -q kobwebBrowserCacheId)" >> "$GITHUB_OUTPUT"

      - name: Cache browser dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-cache-id.outputs.value }}

      - name: Cache Kobweb CLI
        id: kobweb-cli-cache
        uses: actions/cache@v6
        with:
          path: kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip
          key: kobweb-cli-${{ runner.os }}-${{ env.KOBWEB_CLI_VERSION }}

      - name: Fetch Kobweb CLI
        if: steps.kobweb-cli-cache.outputs.cache-hit != 'true'
        uses: robinraju/release-downloader@v1.13
        with:
          repository: varabyte/kobweb-cli
          tag: v${{ env.KOBWEB_CLI_VERSION }}
          fileName: kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip
          tarBall: false
          zipBall: false

      - name: Unzip Kobweb CLI
        run: unzip kobweb-${KOBWEB_CLI_VERSION}.zip

      - name: Export site
        run: ./kobweb-${KOBWEB_CLI_VERSION}/bin/kobweb export --notty --layout static
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy .kobweb/site/ --project-name=ayfri-deploy
