name: Lock Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Install npm deps
        run: ./gradlew kotlinNpmInstall
      - name: Show environment
        run: |
          echo "node: $(find ~/.gradle/nodejs -maxdepth 1 -type d)"
          ~/.gradle/nodejs/*/bin/node -v || true
          ~/.gradle/nodejs/*/bin/npm -v || true
      - name: Diff lock
        run: |
          diff -u kotlin-js-store/package-lock.json build/js/package-lock.json > /tmp/lock.diff && echo "IDENTICAL" || true
          echo "diff lines: $(wc -l < /tmp/lock.diff)"
          head -c 60000 /tmp/lock.diff
