kotlin.code.style=official
kotlin.incremental.js.ir=true
kotlin.js.ir.output.granularity=per-module

# npm drives the Kotlin/JS toolchain; the Yarn integration is on its way out of the Kotlin Gradle plugin (KT-84662).
kotlin.js.yarn=false

# Kobweb Gradle plugin tasks emit CC serialization problems until upstream support ships;
# warn keeps :build green while still using the cache for compatible work.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
